<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Illustration: low-frequency noise bands from a data center spreading over a neighborhood</title>
<desc id="heroDesc">A stylized aerial illustration showing a data center building on the right with noise contour bands spreading left over houses, colored from amber near the facility to green farther away. Labeled as an illustration.</desc>
<!-- ground -->
<rect width="1200" height="500" fill="#f2f5ea"/>
<!-- streets -->
<g stroke="#e2e7d4" stroke-width="14" fill="none">
<path d="M0 120 H1200"/><path d="M0 260 H1200"/><path d="M0 400 H1200"/>
<path d="M180 0 V500"/><path d="M420 0 V500"/><path d="M660 0 V500"/><path d="M900 0 V500"/>
</g>
<!-- contour bands (amber->green), centered on the data center plant -->
<g opacity="0.85">
<ellipse cx="1010" cy="250" rx="430" ry="215" fill="#e07b39" opacity="0.10"/>
<ellipse cx="1010" cy="250" rx="340" ry="170" fill="#e07b39" opacity="0.16"/>
<ellipse cx="1010" cy="250" rx="255" ry="128" fill="#dd8a2f" opacity="0.22"/>
<ellipse cx="1010" cy="250" rx="175" ry="88" fill="#d99a26" opacity="0.30"/>
<ellipse cx="1010" cy="250" rx="105" ry="53" fill="#d5a51f" opacity="0.38"/>
<ellipse cx="1010" cy="250" rx="55" ry="28" fill="#cfa50f" opacity="0.5"/>
</g>
<!-- data center plant -->
<g transform="translate(900,205)">
<rect x="0" y="0" width="230" height="95" rx="6" fill="#3a4a3e"/>
<!-- fan wall -->
<g fill="#5d705f">
<rect x="10" y="10" width="40" height="40" rx="4"/><rect x="60" y="10" width="40" height="40" rx="4"/><rect x="110" y="10" width="40" height="40" rx="4"/><rect x="160" y="10" width="40" height="40" rx="4"/>
<rect x="10" y="55" width="40" height="30" rx="4"/><rect x="60" y="55" width="40" height="30" rx="4"/><rect x="110" y="55" width="40" height="30" rx="4"/><rect x="160" y="55" width="40" height="30" rx="4"/>
</g>
<!-- fan blades -->
<g stroke="#cbd5c2" stroke-width="2.5" fill="none">
<circle cx="30" cy="30" r="11"/><path d="M30 22 V38 M22 30 H38 M24.5 24.5 L35.5 35.5 M35.5 24.5 L24.5 35.5"/>
<circle cx="80" cy="30" r="11"/><path d="M80 22 V38 M72 30 H88 M74.5 24.5 L85.5 35.5 M85.5 24.5 L74.5 35.5"/>
<circle cx="130" cy="30" r="11"/><path d="M130 22 V38 M122 30 H138 M124.5 24.5 L135.5 35.5 M135.5 24.5 L124.5 35.5"/>
<circle cx="180" cy="30" r="11"/><path d="M180 22 V38 M172 30 H188 M174.5 24.5 L185.5 35.5 M185.5 24.5 L174.5 35.5"/>
</g>
<text x="115" y="120" text-anchor="middle" font-family="system-ui" font-size="15" fill="#445243" font-weight="600">Data center cooling plant</text>
</g>
<!-- houses (silhouettes) -->
<g fill="#6d7c66">
<g transform="translate(120,180)"><rect x="0" y="30" width="66" height="42" rx="3"/><polygon points="-6,32 33,4 72,32"/><rect x="26" y="48" width="14" height="24" fill="#4a5545"/></g>
<g transform="translate(120,320)"><rect x="0" y="30" width="66" height="42" rx="3"/><polygon points="-6,32 33,4 72,32"/><rect x="26" y="48" width="14" height="24" fill="#4a5545"/></g>
<g transform="translate(360,110)"><rect x="0" y="30" width="66" height="42" rx="3"/><polygon points="-6,32 33,4 72,32"/><rect x="26" y="48" width="14" height="24" fill="#4a5545"/></g>
<g transform="translate(360,250)"><rect x="0" y="30" width="66" height="42" rx="3"/><polygon points="-6,32 33,4 72,32"/><rect x="26" y="48" width="14" height="24" fill="#4a5545"/></g>
<g transform="translate(360,390)"><rect x="0" y="30" width="66" height="42" rx="3"/><polygon points="-6,32 33,4 72,32"/><rect x="26" y="48" width="14" height="24" fill="#4a5545"/></g>
<g transform="translate(600,180)"><rect x="0" y="30" width="66" height="42" rx="3"/><polygon points="-6,32 33,4 72,32"/><rect x="26" y="48" width="14" height="24" fill="#4a5545"/></g>
<g transform="translate(600,320)"><rect x="0" y="30" width="66" height="42" rx="3"/><polygon points="-6,32 33,4 72,32"/><rect x="26" y="48" width="14" height="24" fill="#4a5545"/></g>
</g>
<!-- legend chip -->
<g transform="translate(40,30)">
<rect x="0" y="0" width="252" height="128" rx="10" fill="#ffffff" opacity="0.94" stroke="#dbe2cd"/>
<text x="16" y="28" font-family="system-ui" font-size="15" font-weight="700" fill="#3d4a3a">Digital reading (relative)</text>
<rect x="16" y="44" width="26" height="14" rx="3" fill="#cfa50f"/><text x="50" y="56" font-family="system-ui" font-size="13" fill="#5a654f">Strong low-frequency tone</text>
<rect x="16" y="66" width="26" height="14" rx="3" fill="#dd8a2f" opacity="0.8"/><text x="50" y="78" font-family="system-ui" font-size="13" fill="#5a654f">Moderate</text>
<rect x="16" y="88" width="26" height="14" rx="3" fill="#e07b39" opacity="0.5"/><text x="50" y="100" font-family="system-ui" font-size="13" fill="#5a654f">Slight</text>
<text x="16" y="118" font-family="system-ui" font-size="11" fill="#8a927e">Illustration - synthetic example, not a real location</text>
</g>
</svg>